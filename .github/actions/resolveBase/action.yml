name: resolveBase
description: Finds the revision a run’s reports compare with, the state before a push or where a pull request branched off
outputs:
  sha:
    description: the base revision’s commit, empty for runs without one, like manual ones or the first push of a branch
    value: ${{ steps.resolveBase.outputs.sha }}
runs:
  using: composite
  steps:
  - name: resolveBase
    id: resolveBase
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      before: ${{ github.event.before }}
      head: ${{ github.event.pull_request.head.sha }}
      baseTip: ${{ github.event.pull_request.base.sha }}
    run: |
      sha=
      case "$GITHUB_EVENT_NAME" in
        # A pull request’s head compares with where it branched off, just like the pull request’s own diff.
        pull_request) sha=$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseTip...$head" --jq .merge_base_commit.sha) ;;
        # A push of several commits compares with the state before all of them, which had a run of its own; a new branch has none.
        push) [[ $before =~ ^0+$ ]] || sha=$before ;;
      esac
      echo "sha=$sha" >> "$GITHUB_OUTPUT"
