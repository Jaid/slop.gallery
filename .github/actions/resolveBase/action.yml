name: resolveBase
description: Finds the revision a run’s reports compare with, the state before a push or the base branch a pull request merges into, for checkouts of at least two commits
outputs:
  sha:
    description: the base revision’s commit, empty for runs without one, like manual ones or the first push of a branch
    value: ${{ steps.resolveBase.outputs.sha }}
runs:
  using: composite
  steps:
  - name: resolveBase
    id: resolveBase
    shell: bash
    env:
      before: ${{ github.event.before }}
    run: |
      sha=
      case "$GITHUB_EVENT_NAME" in
        # The merge commit’s first parent is exactly the base its changes apply to, unlike the event’s base.sha, which can lag behind the branch.
        pull_request) sha=$(git rev-parse HEAD^1) ;;
        # A push of several commits compares with the state before all of them, which had a run of its own; a new branch has none.
        push) [[ $before =~ ^0+$ ]] || sha=$before ;;
      esac
      echo "sha=$sha" >> "$GITHUB_OUTPUT"
