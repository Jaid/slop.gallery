name: test_packages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Every workspace package with a test script, at any depth, for a job of its own, and whether its tests need the media tools.
  listPackages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.listPackages.outputs.packages }}
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: listPackages
      id: listPackages
      shell: bash
      run: |
        bun --eval "$(cat << 'EOF'
        // The packages whose tests encode or read media with ffmpeg, cjxl or ImageMagick.
        const mediaPackages = new Set(['knot-materials', 'vite-plugin-import-voice-sample', 'vite-plugin-jxl', 'voice-sample-store'])
        const {workspaces} = await Bun.file('package.json').json()
        const packages = []
        for (const pattern of workspaces) {
          for await (const manifest of new Bun.Glob(`${pattern}/package.json`).scan()) {
            const {name, scripts} = await Bun.file(manifest).json()
            if (scripts?.test) {
              packages.push({name, folder: manifest.replace(/\/package\.json$/, ''), media: mediaPackages.has(name)})
            }
          }
        }
        const unknown = [...mediaPackages].filter(name => !packages.some(item => item.name === name))
        if (unknown.length) {
          throw new Error(`No package with a test script is named ${unknown.join(', ')}.`)
        }
        console.log(`packages=${JSON.stringify(packages.toSorted((a, b) => a.name.localeCompare(b.name)))}`)
        EOF
        )" >> "$GITHUB_OUTPUT"
  testPackage:
    needs: listPackages
    name: ${{ matrix.package.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.listPackages.outputs.packages) }}
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    # Only for the packages that encode media in their tests, like voice-sample-store with ffmpeg and vite-plugin-jxl with cjxl and ImageMagick.
    - name: setupMediaTools
      if: matrix.package.media
      uses: ./.github/actions/setupMediaTools
    - name: install
      run: bun install --frozen-lockfile
    - name: test
      working-directory: ${{ matrix.package.folder }}
      run: bun run test
