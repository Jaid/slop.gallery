name: checkBuild
# Called by the build workflow with the production build it uploaded as the artifact build, which it verifies instead of building one of its own.
on:
  workflow_call:
jobs:
  checkBuild:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.4
    - name: install
      run: bun install --frozen-lockfile
    - name: downloadBuild
      uses: actions/download-artifact@v8.0.2
      with:
        name: build
    - name: checkBuild
      run: bun run check:build
