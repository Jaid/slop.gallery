name: pruneDomains
# Pages takes only 100 custom domains per project, and those of pull requests from forks stay after they close, so this detaches pr-<number>.slop.gallery domains past a count, those of closed pull requests first, which closed longest ago, then those of open ones, which opened longest ago.
on:
  workflow_dispatch:
    inputs:
      minimumDomains:
        description: the pr-<number> domains below which nothing goes
        type: number
        default: 0
      maximumDomains:
        description: the pr-<number> domains to keep at most
        type: number
        required: true
      dryRun:
        description: only list the domains that would go
        type: boolean
        default: false
# Two runs at once would count the same domains and detach them twice.
concurrency:
  group: pruneDomains
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: requireToken
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::The repository secret CLOUDFLARE_API_TOKEN, a Cloudflare API token with Cloudflare Pages: Edit and DNS: Edit on slop.gallery, is missing."
          exit 1
        fi
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        sparse-checkout: |
          scripts/previewDomain.ts
          scripts/prunePreviewDomains.ts
        sparse-checkout-cone-mode: false
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.4
    - name: prune
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
        minimum: ${{ inputs.minimumDomains }}
        maximum: ${{ inputs.maximumDomains }}
        dryRun: ${{ inputs.dryRun }}
      run: |
        flags=()
        if [ "$dryRun" = true ]; then
          flags+=(--dry-run)
        fi
        bun scripts/prunePreviewDomains.ts --minimum "$minimum" --maximum "$maximum" "${flags[@]}" | tee "$RUNNER_TEMP/prune.log"
        sed 's/^/- /' "$RUNNER_TEMP/prune.log" >> "$GITHUB_STEP_SUMMARY"
