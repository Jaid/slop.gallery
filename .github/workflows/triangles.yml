name: triangles
# Called by the build workflow with the production build it uploaded as the artifact build. The dev server’s first visit reoptimizes dependencies while rooms load, which silently leaves rooms out, so the analyses always take a production build.
on:
  workflow_call:
jobs:
  triangles:
    runs-on: ubuntu-26.04
    # The analyses’ graphics and seed, which the report’s title names.
    env:
      graphics: heavy
      seed: 1
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: 1.4.4
    - name: install
      run: bun install --frozen-lockfile
    - name: downloadBuild
      uses: actions/download-artifact@v8.0.2
      with:
        name: build
    # Chrome’s software rendering needs the surface extensions of a system Vulkan driver.
    - name: installVulkanDriver
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
    - name: resolveBase
      id: resolveBase
      uses: ./.github/actions/resolveBase
    # Analyzing the base revision here would mean building it too, so the deltas compare with the analyses its own run uploaded.
    - name: fetchBaseAnalyses
      id: fetchBaseAnalyses
      if: steps.resolveBase.outputs.sha != ''
      uses: ./.github/actions/fetchBaseArtifact
      with:
        sha: ${{ steps.resolveBase.outputs.sha }}
        name: analyses
        path: ${{ runner.temp }}/baseAnalyses
    # Every room’s triangles, meshes and lights, loaded in the runner’s Chrome on its software Vulkan, the gallery’s and the sandbox’s Cell in the same tables, to the log and the report.
    # The seed decides which default works hang in which slots at which size and which plants stand in the pots, so it is fixed to keep runs comparable.
    # Knottingham is left out, as some of its Knot shaders crash Chrome’s software GPU process.
    - name: analyzeWorlds
      shell: bash
      env:
        BROWSER: /usr/bin/google-chrome
      run: |
        # Chrome’s sandbox needs unprivileged user namespaces, which Ubuntu restricts since 24.04.
        sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
        analyses=()
        bases=()
        analyze() {
          local name=$1
          shift
          bun scripts/analyzeWorld.ts --target dist --swiftshader --height 180 --graphics "$graphics" --seed "$seed" "$@" > "$RUNNER_TEMP/analyses/$name.json"
          analyses+=("$RUNNER_TEMP/analyses/$name.json")
          bases+=(--base "$RUNNER_TEMP/baseAnalyses/$name.json")
        }
        mkdir --parents "$RUNNER_TEMP/analyses"
        analyze gallery
        analyze cell --room cell
        # The deltas need the base of every world, as the rooms of a world without one would count as new.
        compare=()
        if [ -f "$RUNNER_TEMP/baseAnalyses/gallery.json" ] && [ -f "$RUNNER_TEMP/baseAnalyses/cell.json" ]; then
          compare=("${bases[@]}")
        fi
        bun scripts/worldReport.ts "${compare[@]}" "${analyses[@]}" | tee "$RUNNER_TEMP/triangles.md"
    # For the runs of later revisions to compare with. Pull request runs measure pull requests, which nothing compares with.
    - name: uploadAnalyses
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: analyses
        path: ${{ runner.temp }}/analyses
    # To the job summary, or for a pull request to its comment.
    - name: publishReport
      uses: ./.github/actions/publishReport
      with:
        file: ${{ runner.temp }}/triangles.md
        id: triangles
        title: triangles (${{ env.graphics }} graphics, seed ${{ env.seed }})
        base: ${{ steps.fetchBaseAnalyses.outputs.base }}
