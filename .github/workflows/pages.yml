name: pages
on:
  workflow_call:
  pull_request:
    types: [closed]
jobs:
  deploy:
    # Pull requests from forks get no secrets, so the previewFork workflow deploys those of MageCast’s fork.
    if: github.event_name != 'pull_request' || github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Each main commit gets an immutable preview. Pull requests only keep their latest deployment.
    concurrency:
      group: pages-${{ github.event.pull_request.number || github.ref_name == 'main' && github.sha || github.ref }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.attachDomain.outputs.url || steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url || steps.deployCommit.outputs.pages-deployment-alias-url || steps.deployCommit.outputs.deployment-url }}
    env:
      branch: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
    steps:
    - name: requireToken
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::The repository secret CLOUDFLARE_API_TOKEN, a Cloudflare API token with Cloudflare Pages: Edit and DNS: Edit on slop.gallery, is missing."
          exit 1
        fi
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: install
      run: bun install --frozen-lockfile
    - name: downloadBuild
      uses: actions/download-artifact@v8.0.2
      with:
        name: build
    # A build of main that took longer than that of a newer push would otherwise deploy over it.
    - name: checkHead
      id: checkHead
      if: env.branch == 'main'
      run: echo "current=$([ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - name: deploy
      id: deploy
      if: env.branch != 'main' || steps.checkHead.outputs.current == 'true'
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 94b07787e8a720b65196137d6224ec90
        packageManager: bun
        wranglerVersion: 4.169.0
        command: pages deploy dist --project-name=slop-gallery --branch=${{ env.branch }} --commit-dirty=false
    # Other branches have no close event to retire a custom domain.
    - name: attachDomain
      id: attachDomain
      if: steps.deploy.outcome == 'success' && (env.branch == 'main' || github.event_name == 'pull_request')
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        alias: ${{ env.branch == 'main' && 'canary' || env.branch }}
      run: |
        bun scripts/previewDomain.ts attach "$alias" "$branch"
        echo "url=https://$alias.slop.gallery" >> "$GITHUB_OUTPUT"
    - name: shortenCommit
      id: shortenCommit
      if: env.branch == 'main'
      run: echo "hash=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
    - name: deployCommit
      id: deployCommit
      if: env.branch == 'main'
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: 94b07787e8a720b65196137d6224ec90
        packageManager: bun
        wranglerVersion: 4.169.0
        command: pages deploy dist --project-name=slop-gallery --branch=main-${{ steps.shortenCommit.outputs.hash }} --commit-dirty=false
  detachDomain:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    concurrency:
      group: pages-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
    # The default branch’s script, not the pull request’s, which may predate it.
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        sparse-checkout: |
          /package.json
          scripts/previewDomain.ts
        sparse-checkout-cone-mode: false
    - name: setupBun
      uses: oven-sh/setup-bun@v2.2.0
    - name: detachDomain
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        alias: pr-${{ github.event.pull_request.number }}
      run: bun scripts/previewDomain.ts detach "$alias"
