name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to a pull request replaces the run of an older one, so two runs never race to create its comments. Every push to main runs to its end, as later ones compare with what it measured.
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The one production build of the revision, which the deployment and the reports on it all take.
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    # A pull request’s head, not its merge commit, so the preview shows what was pushed and the reports what it changed since it branched off.
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: buildSite
      uses: ./.github/actions/buildSite
    # Only for the jobs below, which download it within minutes.
    - name: uploadBuild
      uses: actions/upload-artifact@v7.0.2
      with:
        name: dist
        path: dist
        include-hidden-files: true
        retention-days: 1
  pages:
    needs: build
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
    secrets: inherit
  triangles:
    needs: build
    uses: ./.github/workflows/triangles.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
  buildSize:
    needs: build
    uses: ./.github/workflows/buildSize.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
